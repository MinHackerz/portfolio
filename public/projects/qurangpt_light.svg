<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="qgLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="qgEmeraldGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldTextGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <pattern id="qgGridLight" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0F172A" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#qgLightBg)"/>
  <rect width="1200" height="675" fill="url(#qgGridLight)"/>

  <!-- Subtle Emerald Ambient Glow -->
  <circle cx="600" cy="300" r="380" fill="url(#qgEmeraldGlowLight)"/>

  <!-- Top App Window Bar -->
  <rect x="30" y="22" width="1140" height="54" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  
  <!-- Window Dots -->
  <circle cx="58" cy="49" r="5" fill="#94A3B8"/>
  <circle cx="74" cy="49" r="5" fill="#94A3B8"/>
  <circle cx="90" cy="49" r="5" fill="#94A3B8"/>

  <!-- App Title &amp; Badges -->
  <g transform="translate(118, 38)">
    <text x="0" y="14" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">QuranGPT</text>
    <rect x="80" y="0" width="80" height="20" rx="4" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="120" y="14" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">AI ENGINE</text>
  </g>

  <!-- Search Input Bar -->
  <g transform="translate(390, 34)">
    <rect width="480" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="20" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#059669">✦</text>
    <text x="32" y="19" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1E293B">What does the Quran say about patience in hardship?</text>
  </g>

  <!-- Top Right Model Selector -->
  <g transform="translate(980, 36)">
    <rect width="170" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="14" cy="13" r="3" fill="#059669"/>
    <text x="24" y="17" font-family="'Space Mono', monospace" font-size="9.5" fill="#475569">GPT-4o + Vector RAG</text>
  </g>

  <!-- Main Content Grid -->
  <!-- Left Box: Surah Verse Result (540px) -->
  <g transform="translate(30, 96)">
    <rect width="550" height="545" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Verse Header Pill -->
    <g transform="translate(24, 24)">
      <rect width="150" height="26" rx="5" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="12" y="17" font-family="'Space Mono', monospace" font-size="10.5" font-weight="700" fill="#047857">SURAH ASH-SHARH 94:5-6</text>
      <text x="490" y="18" font-family="'Space Mono', monospace" font-size="10" fill="#64748B" text-anchor="end">MECCAN · JUZ 30</text>
    </g>

    <!-- Arabic Ayah Box -->
    <g transform="translate(24, 68)">
      <rect width="502" height="150" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="251" y="65" font-family="'Amiri', 'Scheherazade New', 'Traditional Arabic', serif" font-size="30" font-weight="700" fill="url(#goldTextGradLight)" text-anchor="middle" letter-spacing="1">
        فَإِنَّ مَعَ الْعُسْرِ يُسْرًا
      </text>
      <text x="251" y="115" font-family="'Amiri', 'Scheherazade New', 'Traditional Arabic', serif" font-size="30" font-weight="700" fill="url(#goldTextGradLight)" text-anchor="middle" letter-spacing="1">
        إِنَّ مَعَ الْعُسْرِ يُسْرًا
      </text>
    </g>

    <!-- Translation -->
    <g transform="translate(24, 240)">
      <text x="0" y="0" font-family="'Space Mono', monospace" font-size="9.5" font-weight="700" fill="#64748B" letter-spacing="0.05em">ENGLISH TRANSLATION (SAHIH INTERNATIONAL)</text>
      <text x="0" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600" fill="#0F172A" leading="1.6">
        "For indeed, with hardship [will be] ease.
      </text>
      <text x="0" y="60" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="600" fill="#0F172A">
        Indeed, with hardship [will be] ease."
      </text>
    </g>

    <!-- Cross Referenced Verses -->
    <g transform="translate(24, 340)">
      <text x="0" y="0" font-family="'Space Mono', monospace" font-size="9.5" font-weight="700" fill="#64748B" letter-spacing="0.05em">THEMATIC CROSS-REFERENCES</text>
      
      <!-- Ref 1 -->
      <g transform="translate(0, 16)">
        <rect width="502" height="52" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="14" y="24" font-family="'Space Mono', monospace" font-size="10.5" font-weight="700" fill="#0284C7">Surah Al-Baqarah 2:153</text>
        <text x="14" y="42" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#475569">"O you who have believed, seek help through patience and prayer..."</text>
      </g>

      <!-- Ref 2 -->
      <g transform="translate(0, 78)">
        <rect width="502" height="52" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="14" y="24" font-family="'Space Mono', monospace" font-size="10.5" font-weight="700" fill="#0284C7">Surah Az-Zumar 39:10</text>
        <text x="14" y="42" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#475569">"Indeed, the patient will be given their reward without account."</text>
      </g>
    </g>

    <!-- Bottom Specs Pill -->
    <rect x="24" y="495" width="502" height="30" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="36" y="514" font-family="'Space Mono', monospace" font-size="9.5" fill="#64748B">
      Quran Foundation API  ·  114 Surahs Indexed  ·  100% Verified Citations
    </text>
  </g>

  <!-- Right Box: AI Synthesized Tafsir &amp; Commentary (570px) -->
  <g transform="translate(600, 96)">
    <rect width="570" height="545" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Header -->
    <g transform="translate(24, 24)">
      <text x="0" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">AI Synthesized Exegesis &amp; Linguistic Analysis</text>
      <rect x="420" y="2" width="95" height="20" rx="4" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="467" y="16" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">VERIFIED TAFSIR</text>
    </g>

    <!-- Linguistic Analysis Section -->
    <g transform="translate(24, 68)">
      <rect width="522" height="150" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
      <text x="16" y="26" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#B45309">LINGUISTIC NUANCE (ARABIC GRAMMAR)</text>
      <text x="16" y="52" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1E293B" leading="1.6">
        The word <tspan font-weight="700" fill="#B45309">الْعُسْرِ (al-'usr)</tspan> is definite with the article <tspan fill="#0284C7">'al'</tspan>, referring to one specific difficulty,
      </text>
      <text x="16" y="74" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1E293B">
        while <tspan font-weight="700" fill="#059669">يُسْرًا (yusran)</tspan> is indefinite without 'al', denoting multiple, boundless eases.
      </text>
      <text x="16" y="104" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#475569">
        Classical scholars (Ibn Abbas) noted: <tspan fill="#0F172A" font-style="italic">"One hardship cannot overcome two eases."</tspan>
      </text>
      <text x="16" y="128" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11.5" fill="#64748B">
        Sources referenced: Tafsir Ibn Kathir, Al-Qurtubi, Al-Tabari.
      </text>
    </g>

    <!-- Key Practical Insights -->
    <g transform="translate(24, 235)">
      <text x="0" y="0" font-family="'Space Mono', monospace" font-size="9.5" font-weight="700" fill="#64748B" letter-spacing="0.05em">ACTIONABLE SPIRITUAL &amp; PSYCHOLOGICAL PRINCIPLES</text>

      <g transform="translate(0, 14)">
        <!-- Point 1 -->
        <rect width="522" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="20" cy="30" r="8" fill="#D1FAE5"/>
        <text x="20" y="34" font-family="'Space Mono', monospace" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">01</text>
        <text x="38" y="24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Hardship is intrinsically accompanied by relief</text>
        <text x="38" y="44" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#475569">The preposition <tspan fill="#B45309">'Ma'a' (with)</tspan> implies ease exists concurrently inside the trial.</text>
      </g>

      <g transform="translate(0, 84)">
        <!-- Point 2 -->
        <rect width="522" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="20" cy="30" r="8" fill="#D1FAE5"/>
        <text x="20" y="34" font-family="'Space Mono', monospace" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">02</text>
        <text x="38" y="24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Active patience over passive despair (Sabrun Jameel)</text>
        <text x="38" y="44" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#475569">Combines spiritual resilience with continuous intentional action.</text>
      </g>

      <g transform="translate(0, 154)">
        <!-- Point 3 -->
        <rect width="522" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="20" cy="30" r="8" fill="#D1FAE5"/>
        <text x="20" y="34" font-family="'Space Mono', monospace" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">03</text>
        <text x="38" y="24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Grounded in canonical sources with zero hallucination</text>
        <text x="38" y="44" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#475569">Strict RAG architecture ensures citations only link to verified Quranic verses.</text>
      </g>
    </g>

    <!-- Bottom Action Pill -->
    <rect x="24" y="495" width="522" height="30" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="36" y="514" font-family="'Space Mono', monospace" font-size="9.5" fill="#64748B">
      <tspan fill="#059669">● LIVE DEMO</tspan>  |  Latency: <tspan fill="#0F172A" font-weight="700">420ms</tspan>  |  Embeddings: text-embedding-3-large
    </text>
  </g>
</svg>
