  <!-- Ring 2 -->
  <circle cx="300" cy="165" r="46" stroke="#27272A" stroke-width="8"/>
  <circle cx="300" cy="165" r="46" stroke="#34D399" stroke-width="8" stroke-dasharray="289" stroke-dashoffset="26" stroke-linecap="round"/>
  <text x="300" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#F4F4F5" text-anchor="middle">91</text>
